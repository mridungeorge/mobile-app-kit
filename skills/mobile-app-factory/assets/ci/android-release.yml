name: Android Release (Native Kotlin / Gradle)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks

      - name: Lint & Test
        run: ./gradlew lint test

      - name: Build Release AAB
        env:
          KEYSTORE_PATH: app/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/bundle/release/*.aab

      # Upload to the Play internal track with fastlane supply. Needs a Gemfile with
      # fastlane, the service-account secret, and one AAB already uploaded by hand.
      # The `internal` lane rebuilds the AAB itself, so drop the separate build step
      # above if you want a single build. ANDROID_DIR points at the Gradle folder
      # (this workflow assumes it is the repo root).
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Write Play service-account key
        run: echo '${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}' > play-service-account.json
      - name: Upload to Play (internal)
        run: bundle exec fastlane android internal
        env:
          ANDROID_DIR: .
          PLAY_JSON_KEY: play-service-account.json
          KEYSTORE_PATH: app/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
