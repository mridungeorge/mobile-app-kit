name: iOS Release (Native Swift/SwiftUI, Xcode)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-test-archive:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -scheme "$SCHEME" -project "$PROJECT" || true
        env:
          SCHEME: App
          PROJECT: App.xcodeproj

      - name: Test
        run: |
          xcodebuild test \
            -scheme "$SCHEME" \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -project "$PROJECT"
        env:
          SCHEME: App
          PROJECT: App.xcodeproj

      # Needs a Gemfile with fastlane (the scaffold adds one), the ASC_* secrets, and
      # IOS_PROJECT / IOS_SCHEME set to your project. Set SIGNING=match plus
      # MATCH_GIT_URL / MATCH_PASSWORD if you keep certificates in match.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Build & upload to TestFlight
        run: bundle exec fastlane beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
