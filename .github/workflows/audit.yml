name: audit

# The kit audits itself. Run it on every push and pull request, on all three
# desktop platforms: the Windows job is what catches CRLF regressions in
# `gradlew`, and the macOS/Linux jobs are what catch a CRLF shebang breaking.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Structure, frontmatter, references, archetypes, metadata template, router
      # smoke cases, all 14 profiles, the intake → preview → approval → readiness
      # pipeline, both native templates (including the Gradle wrapper binary) and
      # every image the README references.
      - name: Skill audit
        run: node skills/mobile-app-factory/scripts/check-skill.mjs

      - name: Shell helpers parse
        if: runner.os != 'Windows'
        run: |
          for f in install.sh skills/mobile-app-factory/scripts/*.sh; do
            bash -n "$f" || exit 1
          done

      # A CRLF shebang breaks on Linux, macOS and every CI runner. .gitattributes
      # should make this impossible; this step proves it stayed that way.
      - name: Wrapper and helper scripts are LF
        if: runner.os != 'Windows'
        run: |
          for f in skills/mobile-app-factory/assets/android/project/gradlew \
                   skills/mobile-app-factory/scripts/*.sh \
                   install.sh; do
            if grep -q $'\r' "$f"; then
              echo "CRLF line endings in $f"
              exit 1
            fi
          done

      - name: Promo renderer scripts parse
        run: |
          node --check promo/render.mjs
          node --check promo/browser.mjs
          node --check promo/shot-preview.mjs

  # The audit proves the starters scaffold. These jobs prove they compile: a template
  # that only "exists" can still be broken for months without anyone noticing.
  android-build:
    name: android starter compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches ~/.gradle and the wrapper distribution, keyed on the build files.
      - uses: gradle/actions/setup-gradle@v4

      - name: Scaffold the Android starter
        run: |
          node skills/mobile-app-factory/scripts/scaffold-native.mjs \
            --platform android --name "CI Smoke" --package com.example.cismoke \
            --out "$RUNNER_TEMP/android"

      - name: assembleDebug + unit tests + lint + instrumented-test compile
        working-directory: ${{ runner.temp }}/android
        run: |
          ./gradlew --no-daemon --stacktrace \
            assembleDebug \
            testDebugUnitTest \
            lintDebug \
            assembleDebugAndroidTest

  ios-build:
    name: ios starter compiles
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Scaffold the iOS starter
        run: |
          node skills/mobile-app-factory/scripts/scaffold-native.mjs \
            --platform ios --name "CI Smoke" --bundle-id com.example.cismoke \
            --out "$RUNNER_TEMP/ios"

      # The starter ships project.yml, not a checked-in .xcodeproj, so XcodeGen is
      # what turns it into something xcodebuild can read.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ${{ runner.temp }}/ios
        run: xcodegen generate

      - name: Build for the simulator
        working-directory: ${{ runner.temp }}/ios
        run: |
          xcodebuild \
            -project CISmoke.xcodeproj \
            -scheme CISmoke \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Hard-coding "iPhone 16" broke the moment the runner image moved to a newer Xcode.
      # Ask the image which iPhone simulators it actually has.
      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime in sorted(devices, reverse=True) if "iOS" in runtime
                     for d in devices[runtime] if d["name"].startswith("iPhone")))
          ')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          echo "using simulator $UDID"

      # Building proves it compiles; testing proves the state machine, the SwiftData
      # repository and the auth stubs actually behave. The authoring machine has no
      # Xcode, so this job is where the iOS starter is verified.
      - name: Test on the simulator
        working-directory: ${{ runner.temp }}/ios
        run: |
          set -o pipefail
          xcodebuild \
            -project CISmoke.xcodeproj \
            -scheme CISmoke \
            -destination "id=$SIM_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log

      # The log is unreadable without repo admin rights, so lift the failing lines into
      # check annotations, which anyone can see on the run.
      - name: Report failing tests
        if: failure()
        working-directory: ${{ runner.temp }}/ios
        run: |
          [ -f test.log ] || exit 0
          grep -E "error:|Test Case .* failed|Testing failed" test.log | head -25 \
            | sed 's/%/%25/g' \
            | while IFS= read -r line; do echo "::error::$line"; done
          echo "::error::tail-b64=$(tail -n 30 test.log | base64 | tr -d '\n')"

  # Modules rot silently unless something builds them: scaffold fresh apps with every
  # module that ships platform code switched on, then compile them.
  modules-android:
    name: android starter + modules compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Scaffold and enable modules
        run: |
          node skills/mobile-app-factory/scripts/scaffold-native.mjs \
            --platform android --name "CI Modules" --package com.example.cimodules \
            --out "$RUNNER_TEMP/android"
          node skills/mobile-app-factory/scripts/enable-modules.mjs \
            --platform android --app "$RUNNER_TEMP/android" --package com.example.cimodules \
            --modules billing,push,analytics-crash
      - name: assembleDebug
        working-directory: ${{ runner.temp }}/android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

  modules-ios:
    name: ios starter + modules compiles
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scaffold and enable modules
        run: |
          node skills/mobile-app-factory/scripts/scaffold-native.mjs \
            --platform ios --name "CI Modules" --bundle-id com.example.cimodules \
            --out "$RUNNER_TEMP/ios"
          node skills/mobile-app-factory/scripts/enable-modules.mjs \
            --platform ios --app "$RUNNER_TEMP/ios" --project CIModules \
            --modules billing,push,analytics-crash
      - run: brew install xcodegen
      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime in sorted(devices, reverse=True) if "iOS" in runtime
                     for d in devices[runtime] if d["name"].startswith("iPhone")))
          ')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Generate, build and test
        working-directory: ${{ runner.temp }}/ios
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild -project CIModules.xcodeproj -scheme CIModules \
            -destination "id=$SIM_UDID" \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee test.log
      - name: Report failing tests
        if: failure()
        working-directory: ${{ runner.temp }}/ios
        run: |
          [ -f test.log ] || exit 0
          grep -E "error:|Test Case .* failed|Testing failed" test.log | head -25 \
            | sed 's/%/%25/g' \
            | while IFS= read -r line; do echo "::error::$line"; done
          echo "::error::tail-b64=$(tail -n 30 test.log | base64 | tr -d '\n')"

  expo-build:
    name: expo starter typechecks and bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scaffold the Expo starter
        run: bash "$GITHUB_WORKSPACE/skills/mobile-app-factory/scripts/new-app.sh" expo CiExpo com.example.ciexpo
        working-directory: ${{ runner.temp }}
      - name: Typecheck
        working-directory: ${{ runner.temp }}/CiExpo
        run: npx tsc --noEmit
      - name: Bundle
        working-directory: ${{ runner.temp }}/CiExpo
        run: npx expo export --platform android --platform ios

  motion-demo-build:
    name: motion-demo builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: motion-demo/package-lock.json

      - name: Install
        working-directory: motion-demo
        run: npm ci

      - name: Typecheck
        working-directory: motion-demo
        run: npx tsc --noEmit

      - name: Build
        working-directory: motion-demo
        run: npx vite build

